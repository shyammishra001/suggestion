name: AI Worker

# Ye file SIRF is jagah rakho:  .github/workflows/ai-worker.yml
# "workflow" naam ke folder me rakhoge to GitHub Actions isko kabhi nahi chalayega -
# isi liye ab tak AI connected nahi hua tha. Folder ka naam .github/workflows hona chahiye,
# aage dot (.) ke saath.
#
# ai_worker.py ko repo ke ROOT me rakho (app.py ke bagal me), workflow folder me nahi.
# ai_worker.py ko data/ai_live.json me likhna hai - usi ko ye workflow wapas GitHub me push karega.
#
# GitHub repo me Secret daalna hai:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: INDSTOCKS_TOKEN   Value: tumhara IND Token (24 ghante wala)

on:
  schedule:
    # Market time 09:15-15:30 IST = 03:45-10:00 UTC, har 15 min, Mon-Fri
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:  # Actions tab se haath se bhi chala sakte ho

permissions:
  contents: write

jobs:
  ai-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lo
        uses: actions/checkout@v4

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zaroori package
        run: pip install requests pandas

      - name: AI Worker chalao
        env:
          INDSTOCKS_TOKEN: ${{ secrets.INDSTOCKS_TOKEN }}
        run: python ai_worker.py

      - name: ai_live.json wapas GitHub me daalo
        run: |
          git config user.name "ai-worker"
          git config user.email "ai-worker@github.com"
          git add data/ai_live.json || true
          git diff --cached --quiet || git commit -m "AI Live update"
          git push || true
